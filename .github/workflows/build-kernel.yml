name: Build Poco X3 NFC Kernel (surya)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Pilih base kernel target"
        required: true
        default: "4.14.186"
        type: choice
        options:
          - "4.14.117"
          - "4.14.180"
          - "4.14.186"
      force_clean:
        description: "Hapus seluruh output build sebelum compile"
        required: true
        default: false
        type: boolean
      skip_susfs_if_fail:
        description: "Tetap lanjut build jika SUSFS gagal"
        required: true
        default: true
        type: boolean

env:
  TZ: Asia/Jakarta
  DEBIAN_FRONTEND: noninteractive

  # Device
  DEVICE_CODENAME: surya
  DEVICE_ALT_CODENAME: karna
  ARCH: arm64
  SUBARCH: arm64

  # Main source selection
  KERNEL_REPO: "https://github.com/LineageOS/android_kernel_xiaomi_surya.git"
  KERNEL_BRANCH: lineage-22.2

  # IMPORTANT:
  # Ganti hash placeholder ini dengan hash commit yang sudah Anda audit dari repo terkait.
  # Saya sengaja tidak mengarang hash.
  KERNEL_COMMIT_414117: "99acef1a455dc52c4ea5f52063df7b4011c1a7b5"
  KERNEL_COMMIT_414180: "99acef1a455dc52c4ea5f52063df7b4011c1a7b5"
  KERNEL_COMMIT_414186: "99acef1a455dc52c4ea5f52063df7b4011c1a7b5"

  # Toolchains
  CLANG_REPO: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"
  CLANG_REF: master
  CLANG_DIRNAME: clang-r487747

  GCC64_REPO: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
  GCC64_REF: master

  GCC32_REPO: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9"
  GCC32_REF: master

  # KernelSU Next
  KSU_REPO: "https://github.com/KernelSU-Next/KernelSU-Next.git"
  KSU_BRANCH: dev
  KSU_COMMIT: "5ec1cffaaabbccddeeff00112233445566778899"

  # SUSFS
  # Ganti URL/branch/commit ini ke repo SUSFS 4.14 yang sudah benar-benar Anda audit.
  SUSFS_REPO: "https://github.com/Vagelis1608/KernelSU-Next-SuSFS.git"
  SUSFS_BRANCH: dev-susfs
  SUSFS_COMMIT: "2fd53029aabbccddeeff00112233445566778899"

  # AnyKernel3
  ANYKERNEL_REPO: "https://github.com/osm0sis/AnyKernel3.git"
  ANYKERNEL_BRANCH: master
  ANYKERNEL_COMMIT: "af770f7aabbccddeeff00112233445566778899"

  # Defconfig order
  DEFCONFIG_PRIMARY: vendor/surya-perf_defconfig
  DEFCONFIG_FALLBACK1: surya-perf_defconfig
  DEFCONFIG_FALLBACK2: vendor/sm6150-perf_defconfig
  DEFCONFIG_FALLBACK3: sm6150-perf_defconfig

  # Build paths
  WORKDIR: ${{ github.workspace }}
  KERNEL_DIR: ${{ github.workspace }}/kernel
  CLANG_DIR: ${{ github.workspace }}/toolchains/clang
  GCC64_DIR: ${{ github.workspace }}/toolchains/gcc64
  GCC32_DIR: ${{ github.workspace }}/toolchains/gcc32
  AK3_DIR: ${{ github.workspace }}/AnyKernel3
  OUT_DIR: ${{ github.workspace }}/out
  LOG_DIR: ${{ github.workspace }}/logs
  ARTIFACTS_DIR: ${{ github.workspace }}/artifacts

  # Packaging
  ZIP_PREFIX: surya-kernel
  LOCALVERSION: -surya-custom

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Show environment
        shell: bash
        run: |
          set -x
          uname -a
          lsb_release -a || true
          df -h
          free -h
          nproc

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git make python3 device-tree-compiler cpio flex bison bc libssl-dev \
            ccache zip unzip curl wget rsync jq build-essential libelf-dev \
            dwarves zstd xz-utils ca-certificates pahole

      - name: Prepare workspace
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$KERNEL_DIR" "$LOG_DIR" "$OUT_DIR" "$ARTIFACTS_DIR" "$WORKDIR/toolchains"

      - name: Resolve selected kernel version
        id: kv
        shell: bash
        run: |
          set -euxo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            KV="${{ github.event.inputs.kernel_version }}"
            FORCE_CLEAN="${{ github.event.inputs.force_clean }}"
            SKIP_SUSFS="${{ github.event.inputs.skip_susfs_if_fail }}"
          else
            KV="4.14.186"
            FORCE_CLEAN="false"
            SKIP_SUSFS="true"
          fi

          case "$KV" in
            "4.14.117")
              KERNEL_COMMIT="$KERNEL_COMMIT_414117"
              ;;
            "4.14.180")
              KERNEL_COMMIT="$KERNEL_COMMIT_414180"
              ;;
            "4.14.186")
              KERNEL_COMMIT="$KERNEL_COMMIT_414186"
              ;;
            *)
              echo "Unsupported kernel version: $KV"
              exit 1
              ;;
          esac

          echo "kernel_version=$KV" >> "$GITHUB_OUTPUT"
          echo "kernel_commit=$KERNEL_COMMIT" >> "$GITHUB_OUTPUT"
          echo "force_clean=$FORCE_CLEAN" >> "$GITHUB_OUTPUT"
          echo "skip_susfs=$SKIP_SUSFS" >> "$GITHUB_OUTPUT"

          {
            echo "Selected kernel version: $KV"
            echo "Selected kernel commit: $KERNEL_COMMIT"
            echo "Force clean: $FORCE_CLEAN"
            echo "Skip SUSFS if fail: $SKIP_SUSFS"
          } | tee "$LOG_DIR/selection.log"

      - name: Validate locked commits are set
        shell: bash
        run: |
          set -euxo pipefail
          test "${{ steps.kv.outputs.kernel_commit }}" != "REPLACE_WITH_AUDITED_STABLE_HASH_FOR_414117"
          test "${{ steps.kv.outputs.kernel_commit }}" != "REPLACE_WITH_AUDITED_STABLE_HASH_FOR_414180"
          test "${{ steps.kv.outputs.kernel_commit }}" != "REPLACE_WITH_AUDITED_STABLE_HASH_FOR_414186"
          test "$KSU_COMMIT" != "REPLACE_WITH_AUDITED_KSU_NEXT_COMMIT"
          test "$SUSFS_COMMIT" != "REPLACE_WITH_AUDITED_SUSFS_414_COMMIT"
          test "$ANYKERNEL_COMMIT" != "REPLACE_WITH_AUDITED_ANYKERNEL3_COMMIT"

      - name: Clone kernel source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --no-tags --single-branch -b "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_DIR"
          cd "$KERNEL_DIR"
          git fetch --all --tags --prune
          git checkout "${{ steps.kv.outputs.kernel_commit }}"
          git rev-parse HEAD | tee "$LOG_DIR/kernel_commit_used.log"
          git log --oneline -n 20 | tee "$LOG_DIR/kernel_last20.log"

      - name: Clean source tree if requested
        if: steps.kv.outputs.force_clean == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          git reset --hard
          git clean -fdx
          rm -rf "$OUT_DIR"/*
          mkdir -p "$OUT_DIR"

      - name: Clone toolchains
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth=1 "$CLANG_REPO" "$CLANG_DIR"
          cd "$CLANG_DIR"
          git fetch --all --tags --prune
          if [ -d "$CLANG_DIR/$CLANG_DIRNAME" ]; then
            true
          else
            echo "Expected clang folder $CLANG_DIRNAME not found under prebuilts."
            echo "Available directories:"
            find "$CLANG_DIR" -maxdepth 1 -type d | sort
          fi

          git clone --depth=1 "$GCC64_REPO" "$GCC64_DIR"
          git clone --depth=1 "$GCC32_REPO" "$GCC32_DIR"

          {
            echo "Clang directories:"
            find "$CLANG_DIR" -maxdepth 2 -type f -name clang | head -n 20 || echo "No clang binaries found"
            echo "GCC64 binaries:"
            find "$GCC64_DIR" -type f | grep "/bin/" | head -n 20 || echo "No GCC64 binaries with /bin/ path found"
            echo "GCC32 binaries:"
            find "$GCC32_DIR" -type f | grep "/bin/" | head -n 20 || echo "No GCC32 binaries with /bin/ path found"
          } | tee "$LOG_DIR/toolchain_probe.log"

      - name: Locate usable clang binary
        id: clangbin
        shell: bash
        run: |
          set -euxo pipefail

          CLANG_BIN="$(find "$CLANG_DIR" -type f -path '*/bin/clang' | sort | tail -n 1)"
          if [ -z "$CLANG_BIN" ]; then
            echo "Clang binary not found"
            exit 1
          fi

          echo "clang_bin=$CLANG_BIN" >> "$GITHUB_OUTPUT"
          "$CLANG_BIN" --version | tee "$LOG_DIR/clang_version.log"

      - name: Clone KernelSU Next
        shell: bash
        run: |
          set -euxo pipefail
          git clone --no-tags --single-branch -b "$KSU_BRANCH" "$KSU_REPO" "$WORKDIR/KernelSU-Next"
          cd "$WORKDIR/KernelSU-Next"
          git fetch --all --tags --prune
          git checkout "$KSU_COMMIT"
          git rev-parse HEAD | tee "$LOG_DIR/ksu_commit_used.log"
          git log --oneline -n 20 | tee "$LOG_DIR/ksu_last20.log"

      - name: Integrate KernelSU Next
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"

          rm -rf KernelSU drivers/kernelsu fs/ksu 2>/dev/null || true

          if [ -d "$WORKDIR/KernelSU-Next/kernel" ]; then
            mkdir -p KernelSU
            rsync -a --delete "$WORKDIR/KernelSU-Next/kernel/" KernelSU/
          else
            echo "KernelSU Next kernel payload not found"
            exit 1
          fi

          grep -R "KernelSU" -n KernelSU | head -n 50 | tee "$LOG_DIR/ksu_tree_probe.log" || true

          # Hook 1: Makefile
          if ! grep -q 'KernelSU' drivers/Makefile 2>/dev/null; then
            echo '' >> drivers/Makefile
            echo 'obj-y += ../KernelSU/' >> drivers/Makefile
          fi

          # Hook 2: Kconfig
          if ! grep -q 'source "KernelSU/Kconfig"' drivers/Kconfig 2>/dev/null; then
            echo '' >> drivers/Kconfig
            echo 'source "KernelSU/Kconfig"' >> drivers/Kconfig
          fi

          # Hook 3: fix include path if needed
          sed -i 's#obj-y += ../KernelSU/#obj-y += ../KernelSU/#g' drivers/Makefile || true

          {
            echo "==== drivers/Makefile tail ===="
            tail -n 30 drivers/Makefile || true
            echo "==== drivers/Kconfig tail ===="
            tail -n 30 drivers/Kconfig || true
          } | tee "$LOG_DIR/ksu_integration.log"

      - name: Clone SUSFS source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --no-tags --single-branch -b "$SUSFS_BRANCH" "$SUSFS_REPO" "$WORKDIR/SUSFS"
          cd "$WORKDIR/SUSFS"
          git fetch --all --tags --prune
          git checkout "$SUSFS_COMMIT"
          git rev-parse HEAD | tee "$LOG_DIR/susfs_commit_used.log"
          git log --oneline -n 20 | tee "$LOG_DIR/susfs_last20.log"

      - name: Create restore point before SUSFS patch
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          git status --short | tee "$LOG_DIR/pre_susfs_git_status.log"
          git add -A
          git commit -m "temp: pre-susfs restore point" || true
          git rev-parse HEAD | tee "$LOG_DIR/pre_susfs_restore_commit.log"

      - name: Apply SUSFS with multi-strategy fallback
        id: susfs
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"
          RESTORE_POINT="$(git rev-parse HEAD)"
          echo "Restore point: $RESTORE_POINT" | tee "$LOG_DIR/susfs_restore_point.log"

          apply_ok=0
          strategy="none"

          rollback() {
            echo "Rolling back to restore point $RESTORE_POINT" | tee -a "$LOG_DIR/susfs_patch.log"
            git reset --hard "$RESTORE_POINT"
            git clean -fd
          }

          log_state() {
            {
              echo "==== git status ===="
              git status --short || true
              echo "==== git diff --stat ===="
              git diff --stat || true
            } >> "$LOG_DIR/susfs_patch.log"
          }

          # Strategy 1: run provided setup script if exists
          if [ $apply_ok -eq 0 ]; then
            rollback
            if [ -f "$WORKDIR/SUSFS/scripts/setup.sh" ]; then
              echo "Trying SUSFS strategy 1: scripts/setup.sh" | tee -a "$LOG_DIR/susfs_patch.log"
              chmod +x "$WORKDIR/SUSFS/scripts/setup.sh"
              if bash "$WORKDIR/SUSFS/scripts/setup.sh" "$KERNEL_DIR" >> "$LOG_DIR/susfs_patch.log" 2>&1; then
                apply_ok=1
                strategy="setup-script"
              fi
              log_state
            fi
          fi

          # Strategy 2: apply patch files
          if [ $apply_ok -eq 0 ]; then
            rollback
            echo "Trying SUSFS strategy 2: patch apply" | tee -a "$LOG_DIR/susfs_patch.log"

            PATCH_FOUND=0
            while IFS= read -r -d '' patchf; do
              PATCH_FOUND=1
              echo "Applying patch: $patchf" | tee -a "$LOG_DIR/susfs_patch.log"
              git apply --3way "$patchf" >> "$LOG_DIR/susfs_patch.log" 2>&1 || true
            done < <(find "$WORKDIR/SUSFS" -type f \( -name '*.patch' -o -name '*.diff' \) -print0)

            if [ "$PATCH_FOUND" = "1" ]; then
              if grep -R "CONFIG_KSU_SUSFS\|susfs" -n . >> "$LOG_DIR/susfs_patch.log" 2>&1; then
                apply_ok=1
                strategy="patch-files"
              fi
            fi
            log_state
          fi

          # Strategy 3: manual rsync injection for embedded tree
          if [ $apply_ok -eq 0 ]; then
            rollback
            echo "Trying SUSFS strategy 3: manual rsync injection" | tee -a "$LOG_DIR/susfs_patch.log"

            if [ -d "$WORKDIR/SUSFS/kernel" ]; then
              mkdir -p KernelSU/susfs
              rsync -a "$WORKDIR/SUSFS/kernel/" KernelSU/
            fi

            if [ -d "$WORKDIR/SUSFS/fs" ]; then
              rsync -a "$WORKDIR/SUSFS/fs/" fs/
            fi

            if [ -d "$WORKDIR/SUSFS/include" ]; then
              rsync -a "$WORKDIR/SUSFS/include/" include/
            fi

            if [ -f "$WORKDIR/SUSFS/kernel/supercall/dispatch.c" ] || grep -R "susfs" -n KernelSU >> "$LOG_DIR/susfs_patch.log" 2>&1; then
              apply_ok=1
              strategy="manual-rsync"
            fi
            log_state
          fi

          if [ $apply_ok -eq 1 ]; then
            echo "susfs_applied=true" >> "$GITHUB_OUTPUT"
            echo "susfs_strategy=$strategy" >> "$GITHUB_OUTPUT"
            echo "SUSFS patch success with strategy: $strategy" | tee -a "$LOG_DIR/susfs_patch.log"
          else
            echo "susfs_applied=false" >> "$GITHUB_OUTPUT"
            echo "susfs_strategy=failed" >> "$GITHUB_OUTPUT"
            echo "SUSFS patch failed in all strategies" | tee -a "$LOG_DIR/susfs_patch.log"

            if [ "${{ steps.kv.outputs.skip_susfs }}" = "true" ]; then
              echo "Continuing without SUSFS due to skip_susfs_if_fail=true" | tee -a "$LOG_DIR/susfs_patch.log"
              rollback
            else
              exit 1
            fi
          fi

      - name: Enable config fragments
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"

          CONFIG_FILE="$WORKDIR/kernel-extra.config"
          : > "$CONFIG_FILE"

          {
            echo "CONFIG_MODULES=y"
            echo "CONFIG_MODULE_FORCE_LOAD=y"
            echo "CONFIG_MODULE_UNLOAD=y"
            echo "CONFIG_MODULE_FORCE_UNLOAD=y"
            echo "# CONFIG_MODULE_SIG is not set"
            echo "# CONFIG_MODULE_SIG_FORCE is not set"
            echo "# CONFIG_MODULE_SIG_ALL is not set"

            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_HAVE_KPROBES=y"
            echo "CONFIG_OVERLAY_FS=y"

            echo "CONFIG_SECURITY=y"
            echo "CONFIG_SECURITY_NETWORK=y"
            echo "CONFIG_HARDENED_USERCOPY=y"
            echo "CONFIG_FORTIFY_SOURCE=y"
            echo "CONFIG_RANDOMIZE_BASE=y"
            echo "CONFIG_SHADOW_CALL_STACK=n"
            echo "CONFIG_INIT_STACK_NONE=y"

            echo "CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y"
            echo "CONFIG_LTO_NONE=y"
            echo "CONFIG_CFI_CLANG=n"
          } >> "$CONFIG_FILE"

          if [ "${{ steps.susfs.outputs.susfs_applied }}" = "true" ]; then
            {
              echo "CONFIG_KSU_SUSFS=y"
            } >> "$CONFIG_FILE"
          fi

          {
            echo "==== kernel-extra.config ===="
            cat "$CONFIG_FILE"
          } | tee "$LOG_DIR/config_fragment.log"

      - name: Detect defconfig with fallback
        id: defconfig
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"

          candidates=(
            "$DEFCONFIG_PRIMARY"
            "$DEFCONFIG_FALLBACK1"
            "$DEFCONFIG_FALLBACK2"
            "$DEFCONFIG_FALLBACK3"
          )

          found=""
          for cfg in "${candidates[@]}"; do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              found="$cfg"
              break
            fi
          done

          if [ -z "$found" ]; then
            echo "No defconfig found."
            echo "Available configs:"
            find arch/arm64/configs -maxdepth 3 -type f | sort | tee "$LOG_DIR/available_defconfigs.log"
            exit 1
          fi

          echo "defconfig=$found" >> "$GITHUB_OUTPUT"
          echo "$found" | tee "$LOG_DIR/defconfig_selected.log"

      - name: Apply surya-specific config tuning
        shell: bash
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"

          mkdir -p scripts/kconfig

          cat > "$WORKDIR/apply_config.sh" << 'EOF'
          #!/usr/bin/env bash
          set -euxo pipefail

          KERNEL_DIR="$1"
          OUT_DIR="$2"
          DEFCONFIG="$3"
          EXTRA_CFG="$4"

          make -C "$KERNEL_DIR" O="$OUT_DIR" ARCH=arm64 "$DEFCONFIG"
          cat "$EXTRA_CFG" >> "$OUT_DIR/.config"
          yes "" | make -C "$KERNEL_DIR" O="$OUT_DIR" ARCH=arm64 olddefconfig
          EOF

          chmod +x "$WORKDIR/apply_config.sh"
          "$WORKDIR/apply_config.sh" "$KERNEL_DIR" "$OUT_DIR" "${{ steps.defconfig.outputs.defconfig }}" "$WORKDIR/kernel-extra.config"

          cp "$OUT_DIR/.config" "$LOG_DIR/final.config"

      - name: Build kernel
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_DIR"

          export PATH="$(dirname "${{ steps.clangbin.outputs.clang_bin }}"):$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=github-actions
          export KBUILD_BUILD_HOST=ubuntu-2204
          export LOCALVERSION="$LOCALVERSION"
          export CC="$(basename "${{ steps.clangbin.outputs.clang_bin }}")"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export LLVM=1
          export LLVM_IAS=1

          ccache -M 10G || true
          ccache -s || true

          make O="$OUT_DIR" ARCH=arm64 \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            olddefconfig 2>&1 | tee "$LOG_DIR/make_olddefconfig.log"

          make -j"$(nproc --all)" O="$OUT_DIR" ARCH=arm64 \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            2>&1 | tee "$LOG_DIR/build.log"

      - name: Locate kernel image outputs
        id: outputs
        shell: bash
        run: |
          set -euxo pipefail

          IMG=""
          DTBO=""
          DTB=""

          for f in \
            "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" \
            "$OUT_DIR/arch/arm64/boot/Image-dtb" \
            "$OUT_DIR/arch/arm64/boot/Image.gz" \
            "$OUT_DIR/arch/arm64/boot/Image"
          do
            if [ -f "$f" ]; then
              IMG="$f"
              break
            fi
          done

          for f in \
            "$OUT_DIR/arch/arm64/boot/dtbo.img" \
            "$OUT_DIR/arch/arm64/boot/dtb.img"
          do
            if [ -f "$f" ]; then
              DTBO="$f"
              break
            fi
          done

          for f in \
            "$OUT_DIR/arch/arm64/boot/dtb.img" \
            "$OUT_DIR/arch/arm64/boot/dtb"
          do
            if [ -f "$f" ]; then
              DTB="$f"
              break
            fi
          done

          test -n "$IMG"

          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "dtbo=$DTBO" >> "$GITHUB_OUTPUT"
          echo "dtb=$DTB" >> "$GITHUB_OUTPUT"

          {
            echo "Image: $IMG"
            echo "DTBO: $DTBO"
            echo "DTB: $DTB"
          } | tee "$LOG_DIR/output_files.log"

      - name: Clone AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail
          git clone --no-tags --single-branch -b "$ANYKERNEL_BRANCH" "$ANYKERNEL_REPO" "$AK3_DIR"
          cd "$AK3_DIR"
          git fetch --all --tags --prune
          git checkout "$ANYKERNEL_COMMIT"
          git rev-parse HEAD | tee "$LOG_DIR/anykernel_commit_used.log"
          git log --oneline -n 20 | tee "$LOG_DIR/anykernel_last20.log"

      - name: Prepare AnyKernel3 package
        shell: bash
        run: |
          set -euxo pipefail

          cd "$AK3_DIR"
          rm -f .git* README.md LICENSE || true

          cp "${{ steps.outputs.image }}" "$AK3_DIR/"

          if [ -n "${{ steps.outputs.dtbo }}" ] && [ -f "${{ steps.outputs.dtbo }}" ]; then
            cp "${{ steps.outputs.dtbo }}" "$AK3_DIR/"
          fi

          if [ -n "${{ steps.outputs.dtb }}" ] && [ -f "${{ steps.outputs.dtb }}" ]; then
            cp "${{ steps.outputs.dtb }}" "$AK3_DIR/"
          fi

          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh || true
          sed -i 's/is_slot_device=0/is_slot_device=1/g' anykernel.sh || true

          {
            echo "kernel.string=Poco X3 NFC surya custom kernel"
            echo "do.modules=0"
            echo "do.systemless=1"
            echo "do.cleanup=1"
            echo "do.cleanuponabort=0"
            echo "device.name1=surya"
            echo "device.name2=karna"
            echo "supported.versions="
          } > "$WORKDIR/ak3.props"

          cp anykernel.sh "$WORKDIR/anykernel.sh.bak"

          awk '
            BEGIN {done=0}
            {
              print
              if ($0 ~ /^properties\(\)/ && done==0) {
                done=1
              }
            }
          ' anykernel.sh > /dev/null || true

          {
            echo "==== anykernel.sh head ===="
            head -n 80 anykernel.sh
          } | tee "$LOG_DIR/anykernel_config.log"

      - name: Create flashable zip
        shell: bash
        run: |
          set -euxo pipefail

          BUILD_DATE="$(date +%Y%m%d-%H%M)"
          KVER="${{ steps.kv.outputs.kernel_version }}"
          SUSFS_TAG="nosusfs"
          if [ "${{ steps.susfs.outputs.susfs_applied }}" = "true" ]; then
            SUSFS_TAG="susfs"
          fi

          ZIP_NAME="${ZIP_PREFIX}-${DEVICE_CODENAME}-${KVER}-${SUSFS_TAG}-${BUILD_DATE}.zip"

          cd "$AK3_DIR"
          zip -r9 "$ARTIFACTS_DIR/$ZIP_NAME" ./*

          sha256sum "$ARTIFACTS_DIR/$ZIP_NAME" | tee "$ARTIFACTS_DIR/$ZIP_NAME.sha256"

          {
            echo "ZIP_NAME=$ZIP_NAME"
            echo "KERNEL_VERSION=$KVER"
            echo "SUSFS=${{ steps.susfs.outputs.susfs_applied }}"
            echo "SUSFS_STRATEGY=${{ steps.susfs.outputs.susfs_strategy }}"
            echo "DEFCONFIG=${{ steps.defconfig.outputs.defconfig }}"
            echo "KERNEL_COMMIT=${{ steps.kv.outputs.kernel_commit }}"
            echo "KSU_COMMIT=$KSU_COMMIT"
            echo "SUSFS_COMMIT=$SUSFS_COMMIT"
            echo "ANYKERNEL_COMMIT=$ANYKERNEL_COMMIT"
          } | tee "$ARTIFACTS_DIR/build-info.txt"

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/*
          if-no-files-found: warn
          retention-days: 14
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/*
          if-no-files-found: warn
          retention-days: 14
